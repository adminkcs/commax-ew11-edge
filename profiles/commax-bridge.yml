name: commax-bridge
components:
  - id: main
    capabilities:
      - id: refresh
        version: 1
    categories:
      - name: Bridges
preferences:
  - name: ew11Ip
    title: "EW11 IP 주소"
    description: "Elfin EW11의 로컬 IP 주소를 입력하세요 (기본값: 192.168.50.243)"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 7
      maxLength: 15
      default: "192.168.50.243"
  - name: ew11Port
    title: "EW11 포트 번호"
    description: "EW11에 설정된 TCP 포트 번호를 입력하세요 (기본값: 8899)"
    required: true
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 65535
      default: 8899
  - name: txRetryCount
    title: "명령 재전송 횟수"
    description: "ACK 응답이 없을 때 명령을 재전송할 최대 횟수 (0~10회)"
    required: true
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 10
      default: 5
  - name: txDelay
    title: "재전송 지연 시간 (ms)"
    description: "명령 재전송 시 패킷 간 대기 시간 (밀리초, 기본값: 10ms)"
    required: true
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 1000
      default: 10
  - name: rxTimeout
    title: "수신 버퍼 정리 시간 (ms)"
    description: "불완전한 잔여 수신 버퍼 폐기 임계 시간 (밀리초, 기본값: 10ms)"
    required: true
    preferenceType: integer
    definition:
      minimum: 5
      maximum: 100
      default: 10
  - name: ackTimeout
    title: "응답 대기 시간 (ms)"
    description: "ACK 수신을 기다리는 제한 시간 (밀리초, 기본값: 200ms)"
    required: true
    preferenceType: integer
    definition:
      minimum: 50
      maximum: 2000
      default: 200
  - name: refreshTime
    title: "난방 상태 조회 주기 (초)"
    description: "난방 상태를 주기적으로 조회할 간격 (초 단위, 0은 자동조회 끄기)"
    required: true
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 60
      default: 10
  - name: enableLight
    title: "조명 스위치 사용"
    description: "조명 스위치 기기 생성 및 활성화 여부"
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: lightCount
    title: "조명 개수"
    description: "등록할 조명 스위치 개수 (0~9개)"
    required: true
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 9
      default: 4
  - name: enableOutlet
    title: "콘센트 스위치 사용"
    description: "대기전력/스마트 콘센트 기기 생성 및 활성화 여부"
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: outletCount
    title: "콘센트 개수"
    description: "등록할 콘센트 스위치 개수 (0~12개)"
    required: true
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 12
      default: 10
  - name: enableHeating
    title: "난방 온도조절기 사용"
    description: "각 방 난방 온도조절기 기기 생성 및 활성화 여부"
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: heaterCount
    title: "난방 구역 개수"
    description: "등록할 난방 구역(방) 개수 (0~9개)"
    required: true
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 9
      default: 4
  - name: enableFan
    title: "환기팬 사용"
    description: "전열교환기 환기팬 기기 생성 및 활성화 여부"
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: enableGas
    title: "가스 차단 밸브 사용"
    description: "가스 차단 밸브 기기 생성 (안전 법규상 닫기 전용)"
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: enableAirQuality
    title: "공기질 센서 사용"
    description: "CO2, PM2.5, PM10 복합 공기질 센서 기기 생성"
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: enableElevator
    title: "엘리베이터 호출 사용"
    description: "엘리베이터 하강 호출 버튼 기기 생성"
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: elevatorCallCount
    title: "엘리베이터 호출 반복 전송"
    description: "1회 호출 버튼 클릭 시 패킷 반복 전송 횟수 (1~5회, 기본값 2회)"
    required: true
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 5
      default: 2
