name: commax-bridge
components:
  - id: main
    capabilities:
      - id: refresh
        version: 1
    categories:
      - name: Hub
preferences:
  - name: ew11Ip
    title: "EW11 IP Address"
    description: "Enter the local IP address of your Elfin EW11 (e.g. 192.168.0.83)"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 7
      maxLength: 15
      default: "192.168.0.83"
  - name: ew11Port
    title: "EW11 Port"
    description: "Enter the TCP port configured in EW11 (Default: 8899 or 8888)"
    required: true
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 65535
      default: 8899
  - name: lightCount
    title: "Number of Lights"
    description: "How many lights to discover and create (1 to 9)"
    required: true
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 9
      default: 4
  - name: heaterCount
    title: "Number of Thermostats (Heaters)"
    description: "How many heating zones/rooms to create (0 to 9)"
    required: true
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 9
      default: 4
  - name: outletCount
    title: "Number of Outlets"
    description: "How many switched outlets/plugs to discover and create (0 to 12)"
    required: true
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 12
      default: 10
  - name: enableFan
    title: "Enable Ventilation Fan"
    description: "Create ventilation fan device if available"
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: enableGas
    title: "Enable Gas Valve"
    description: "Create gas valve device (Read & Close only)"
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: enableAirQuality
    title: "Enable Air Quality Sensor"
    description: "Create CO2/PM2.5/PM10 sensor device (read-only) if available"
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: pollInterval
    title: "Heater Status Polling Interval (seconds)"
    description: "Interval to query heaters (0 to disable active query)"
    required: true
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 60
      default: 10
